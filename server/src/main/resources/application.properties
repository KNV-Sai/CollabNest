# Render sets DATABASE_URL as postgres://user:pass@host:5432/dbname — that is not a JDBC URL.
# Set SPRING_DATASOURCE_URL to JDBC form, e.g. jdbc:postgresql://host:5432/dbname (user/pass via username/password env vars).
# You can derive SPRING_DATASOURCE_* from DATABASE_URL in the Render dashboard or a small shell wrapper.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
app.jwt.secret=${APP_JWT_SECRET:mySecretKeyForJwtTokenGenerationAndValidationInSpringBootApplication}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://collabnest-frontend-swi1.onrender.com}
